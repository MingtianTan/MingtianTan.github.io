<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="480" height="360" role="img" aria-label="Spinal reflex arc: a fast loop from a sensor through the spinal cord to a muscle, beside a slower loop through the cortex">
<style>
@font-face{font-family:"SpineRaj";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"SpineMono";font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
.node{fill:#131b28;stroke-width:2.2}
.lbl{fill:#e9eff6;font-family:"SpineRaj","Rajdhani",sans-serif;font-weight:600;font-size:27px;letter-spacing:.03em}
.t-c,.t-m{font-family:"SpineMono","IBM Plex Mono",monospace;font-weight:500;font-size:17px}
.t-c{fill:#19e6ff}.t-m{fill:#ff2fd1}
.wire{fill:none;stroke-width:2.6;stroke-linecap:round}
.still{display:none}
@media (prefers-reduced-motion:reduce){.anim{display:none}.still{display:inline}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1520"/><stop offset="1" stop-color="#0b0f15"/></linearGradient>
<filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="p-aff" d="M 124 85 C 170 80 200 104 214 140"/>
<path id="p-cord" d="M 214 140 C 226 164 226 198 212 222"/>
<path id="p-eff" d="M 212 222 C 186 246 156 236 124 227"/>
<path id="p-up" d="M 228 122 C 220 90 232 64 258 54"/>
<path id="p-down" d="M 352 80 C 352 108 336 130 314 150"/>
</defs>
<rect width="400" height="300" fill="url(#bg)"/>
<use href="#p-aff" class="wire" stroke="rgba(25,230,255,0.7)"/>
<use href="#p-cord" class="wire" stroke="rgba(25,230,255,0.35)"/>
<use href="#p-eff" class="wire" stroke="rgba(255,227,77,0.75)"/>
<use href="#p-up" class="wire" stroke="rgba(255,47,209,0.7)" stroke-dasharray="6 5"/>
<use href="#p-down" class="wire" stroke="rgba(255,47,209,0.7)" stroke-dasharray="6 5"/>
<rect class="node" x="14" y="58" width="110" height="54" rx="12" stroke="#19e6ff"/>
<rect class="node" x="14" y="200" width="110" height="54" rx="12" stroke="#ffe34d"/>
<ellipse class="node" cx="262" cy="182" rx="56" ry="74" stroke="#19e6ff" filter="url(#g)"/>
<ellipse class="node" cx="318" cy="50" rx="62" ry="34" stroke="#ff2fd1" filter="url(#g)"/>
<ellipse class="anim" cx="318" cy="50" rx="62" ry="34" fill="#ff2fd1" opacity="0"><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;0.35;0;0.35;0;0" keyTimes="0;0.3;0.38;0.46;0.54;0.6;1"/></ellipse>
<rect class="anim" x="14" y="200" width="110" height="54" rx="12" fill="#ffe34d" opacity="0" filter="url(#g)"><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;0.75;0;0;0.4;0;0" keyTimes="0;0.23;0.25;0.33;0.85;0.87;0.95;1"/></rect>
<text class="lbl" x="69" y="94" text-anchor="middle">sensor</text>
<text class="lbl" x="69" y="236" text-anchor="middle">muscle</text>
<text class="lbl" x="262" y="177" text-anchor="middle">spinal</text>
<text class="lbl" x="262" y="205" text-anchor="middle">cord</text>
<text class="lbl" x="318" y="59" text-anchor="middle">cortex</text>
<circle class="anim" r="6" fill="#19e6ff" filter="url(#g)"><animateMotion dur="3s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.1;1"><mpath href="#p-aff"/></animateMotion><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.1;0.101;1"/></circle>
<circle class="anim" r="6" fill="#19e6ff" filter="url(#g)"><animateMotion dur="3s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.13;1"><mpath href="#p-cord"/></animateMotion><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.101;0.13;0.131;1"/></circle>
<circle class="anim" r="6" fill="#ffe34d" filter="url(#g)"><animateMotion dur="3s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.13;0.23;1"><mpath href="#p-eff"/></animateMotion><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.13;0.131;0.23;0.231;1"/></circle>
<circle class="anim" r="5" fill="#ff2fd1" filter="url(#g)"><animateMotion dur="3s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1;0.3;1"><mpath href="#p-up"/></animateMotion><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.101;0.3;0.301;1"/></circle>
<circle class="anim" r="5" fill="#ff2fd1" filter="url(#g)"><animateMotion dur="3s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6;0.85;1"><mpath href="#p-down"/></animateMotion><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6;0.601;0.85;0.851;1"/></circle>
<g class="still" filter="url(#g)"><circle cx="189.5" cy="103.6" r="6" fill="#19e6ff"/><circle cx="170" cy="237" r="6" fill="#ffe34d"/><circle cx="230" cy="80" r="5" fill="#ff2fd1"/></g>
<text class="t-c" x="158" y="176" text-anchor="middle">~30 ms</text>
<text class="t-m" x="186" y="40" text-anchor="middle">100s of ms</text>
</svg>
